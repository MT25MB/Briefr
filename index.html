<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Briefr gives you a calm morning rundown of the weather, the news, and what needs you." />
    <title>Briefr: Your morning, made clear</title>
    <script>
      try {
        var pref = localStorage.getItem('briefr_theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#14130f' : '#f7f6f2'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Briefr" />
    <meta property="og:title" content="Briefr — Your morning, made clear" />
    <meta property="og:description" content="Your weather, your news, and what needs you — all in one quiet morning view." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Briefr — Your morning, made clear" />
    <meta name="twitter:description" content="Your weather, your news, and what needs you — all in one quiet morning view." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
